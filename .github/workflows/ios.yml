name: Build iPhone app
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install project generator
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Compile for iPhone without signing
        run: >-
          xcodebuild -project Karman.xcodeproj -scheme Karman
          -configuration Release -sdk iphoneos -destination 'generic/platform=iOS'
          -derivedDataPath build CODE_SIGNING_ALLOWED=NO build
      - name: Package IPA for local signing
        run: |
          mkdir -p package/Payload
          cp -R build/Build/Products/Release-iphoneos/Karman.app package/Payload/
          cd package
          zip -r ../Karman-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: Karman-iPhone
          path: Karman-unsigned.ipa
          retention-days: 3
